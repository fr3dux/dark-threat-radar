services:
  threat-radar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threat-radar
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    ports:
      - "${PORT:-9220}:9220"
    environment:
      - HOST=0.0.0.0
      - PORT=9220
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-300}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - MB_API_KEY=${MB_API_KEY:-}
      - THREATFOX_AUTH_KEY=${THREATFOX_AUTH_KEY:-}
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      - PHISHTANK_API_KEY=${PHISHTANK_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - ENABLE_OPENPHISH=${ENABLE_OPENPHISH:-false}
      - SETTINGS_ADMIN_TOKEN=${SETTINGS_ADMIN_TOKEN:?Run python3 scripts/setup_admin.py first}
      - UPDATE_REPOSITORY=${UPDATE_REPOSITORY:-fr3dux/dark-threat-radar}
      - UPDATE_CHECK_INTERVAL_SECONDS=${UPDATE_CHECK_INTERVAL_SECONDS:-21600}
      - ENABLE_WEB_UPDATES=false
      - DB_PATH=/app/data/threat_radar.db
      - RUNTIME_SECRETS_PATH=/app/data/.runtime-secrets.json
    volumes:
      - threat-radar-data:/app/data
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; exit(0 if urllib.request.urlopen('http://127.0.0.1:9220/api/status', timeout=3).getcode() == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  threat-radar-data:
    driver: local
